<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="1Y61iQQueWIoWmrvXIoqRagfBcyb1uv7-muBEE7CCmY" />
<title>Timings Frequency Converter</title>
<meta name="description" content="Timings Frequency Converter — convert memory timings and frequencies easily.">
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: Segoe UI, Tahoma, Arial, sans-serif;
    background: #f7f9fb;
    color: #1f2937;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .panel {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .row:last-child { margin-bottom: 0; }
  label {
    font-size: 13px;
    color: #4b5563;
    min-width: 150px;
  }
  input[type="number"], input[type="text"] {
    border: 1px solid #d1d5db;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 13px;
    width: 110px;
  }
  input[type="file"] {
    font-size: 13px;
  }
  button {
    border: 1px solid #d1d5db;
    background: #f3f4f6;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #e5e7eb; }
  button.primary {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }
  button.primary:hover { background: #1d4ed8; }
  #status {
    font-size: 12px;
    color: #6b7280;
    min-height: 16px;
    margin-top: 4px;
  }
  #warn {
    font-size: 12px;
    color: #dc2626;
    min-height: 16px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    background: #ffffff;
    font-size: 13px;
  }
  th, td {
    border: 1px solid #e5e7eb;
    padding: 6px 8px;
    text-align: center;
  }
  th {
    background: #e8f0fe;
    color: #1d4ed8;
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  td:first-child, th:first-child {
    text-align: left;
    font-weight: 500;
  }
  td.editable {
    cursor: text;
  }
  td.editable:hover {
    background: #f0f7ff;
  }
  td.editable input {
    width: 90%;
    padding: 2px 4px;
    font-size: 13px;
    border: 1px solid #2563eb;
    border-radius: 3px;
    box-sizing: border-box;
  }
  .table-wrap {
    max-height: 70vh;
    overflow-y: auto;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
  }
  .hint {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .lang-btn {
    padding: 4px 10px;
    font-size: 12px;
  }
  .lang-btn.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #e5e7eb; }
    .panel { background: #1f2937; border-color: #374151; }
    table { background: #1f2937; }
    th { background: #1e3a5f; color: #93c5fd; }
    th, td { border-color: #374151; }
    input, button { background: #111827; color: #e5e7eb; border-color: #374151; }
    td.editable:hover { background: #1e293b; }
  }
</style>
</head>
<body>

<div class="row" style="justify-content: space-between; margin-bottom: 8px;">
  <h1 data-i18n="title" style="margin:0">Timings Frequency Converter</h1>
  <div>
    <button id="langRu" class="lang-btn">RU</button>
    <button id="langEn" class="lang-btn">EN</button>
  </div>
</div>

<div class="panel">
  <div class="row">
    <label data-i18n="importHtml">Импорт отчёта ZenTimings (.html)</label>
    <input type="file" id="fileHtml" accept=".html,.htm">
  </div>
  <div class="row">
    <label data-i18n="importCsv">Импорт CSV (свой экспорт)</label>
    <input type="file" id="fileCsv" accept=".csv">
  </div>
  <div class="row">
    <label data-i18n="orManual">Или начать вручную</label>
    <button id="btnManual" data-i18n="emptyTable">Пустая таблица</button>
  </div>
  <div class="row">
    <label data-i18n="baseFreqLabel">Исходная частота (MT/s)</label>
    <input type="number" id="baseFreq" step="1">
    <label style="min-width:auto" data-i18n="newFreqLabel">Целевая частота (MT/s)</label>
    <input type="number" id="newFreq" step="1" value="6400">
  </div>
  <div class="row">
    <label data-i18n="roundMode">Режим округления</label>
    <label style="min-width:auto"><input type="radio" name="mode" value="safe" id="modeSafe" checked> <span data-i18n="modeSafeLabel">Безопасный (не хуже исходного)</span></label>
    <label style="min-width:auto"><input type="radio" name="mode" value="nearest" id="modeNearest"> <span data-i18n="modeNearestLabel">Ближайшее значение</span></label>
  </div>
  <div class="row">
    <button class="primary" id="btnCalc" data-i18n="calcBtn">Пересчитать</button>
    <button id="btnExport" data-i18n="exportBtn">Экспорт в CSV</button>
  </div>
  <div id="warn"></div>
  <div id="status"></div>
</div>

<p class="hint" data-i18n="hint">Двойной клик по ячейке «Значение» или «нс» — редактировать. При вводе нс подбирается ближайший целый такт.</p>

<div class="table-wrap">
<table id="out">
  <thead>
    <tr>
      <th data-i18n="colTiming">Тайминг</th>
      <th id="hValOld" data-i18n="colValOld">Значение (старая)</th>
      <th id="hNsOld" data-i18n="colNsOld">нс (старая)</th>
      <th id="hValNew" data-i18n="colValNew">Значение (новая)</th>
      <th id="hNsNew" data-i18n="colNsNew">нс (новая)</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<script>
const I18N = {
  ru: {
    title: "Timings Frequency Converter",
    importHtml: "Импорт отчёта ZenTimings (.html)",
    importCsv: "Импорт CSV (свой экспорт)",
    orManual: "Или начать вручную",
    emptyTable: "Пустая таблица",
    baseFreqLabel: "Исходная частота (MT/s)",
    newFreqLabel: "Целевая частота (MT/s)",
    roundMode: "Режим округления",
    modeSafeLabel: "Безопасный (не хуже исходного)",
    modeNearestLabel: "Ближайшее значение",
    calcBtn: "Пересчитать",
    exportBtn: "Экспорт в CSV",
    hint: "Двойной клик по ячейке «Значение» или «нс» — редактировать. При вводе нс подбирается ближайший целый такт.",
    colTiming: "Тайминг",
    colValOld: "Значение (старая)",
    colNsOld: "нс (старая)",
    colValNew: "Значение (новая)",
    colNsNew: "нс (новая)",
    colValOldAt: (f) => `Значение @${f}`,
    colNsOldAt: (f) => `нс @${f}`,
    colValNewAt: (f) => `Значение @${f}`,
    colNsNewAt: (f) => `нс @${f}`,
    statusEmpty: "Пустая таблица со стандартными таймингами ZenTimings. Введите частоту и значения.",
    statusImportedHtml: (n, f) => `Импортировано таймингов: ${n}. Частота из отчёта: ${f} MT/s (можно менять).`,
    statusImportedCsv: (n) => `Импортировано из CSV: ${n} таймингов.`,
    statusDone: (n, mode) => `Готово. Строк: ${n}. Режим: ${mode}.`,
    modeSafeWord: "безопасный",
    modeNearestWord: "ближайшее значение",
    statusNearest: (name, target, best, cyc) => `${name}: ближайшее время к ${target} нс — ${best} нс (${cyc} такт.).`,
    statusCsvSaved: "CSV сохранён.",
    warnLowerFreq: "Целевая частота ниже исходной — тайминги в тактах увеличены, но задержки в нс могут отличаться.",
    alertBaseFreqFirst: (which) => `Сначала укажите ${which} частоту.`,
    which_old: "исходную",
    which_new: "целевую",
    alertIntError: "Тайминг (такты) должен быть целым числом.",
    alertNsError: "Время должно быть числом (нс).",
    alertBaseFreqNeeded: "Укажите исходную частоту.",
    alertNewFreqNeeded: "Укажите целевую частоту.",
    alertTableEmpty: "Таблица пуста.",
    errHtmlNoTable: "Не найдена таблица Memory Timings (id='timingsTable').",
    errHtmlNoFreq: "Не удалось найти строку 'Frequency'.",
    errHtmlRead: "Ошибка чтения отчёта: ",
    errCsvEmpty: "Файл пуст.",
    errCsvCols: "Ожидается 5 столбцов (экспорт этого приложения).",
    errCsvNoTimings: "Не найдено ни одного тайминга.",
    errCsvRead: "Ошибка чтения CSV: ",
  },
  en: {
    title: "Timings Frequency Converter",
    importHtml: "Import ZenTimings report (.html)",
    importCsv: "Import CSV (own export)",
    orManual: "Or start manually",
    emptyTable: "Empty table",
    baseFreqLabel: "Base frequency (MT/s)",
    newFreqLabel: "Target frequency (MT/s)",
    roundMode: "Rounding mode",
    modeSafeLabel: "Safe (not worse than original)",
    modeNearestLabel: "Nearest value",
    calcBtn: "Convert",
    exportBtn: "Export to CSV",
    hint: "Double-click a \"Value\" or \"ns\" cell to edit. Entering ns snaps to the nearest whole clock cycle.",
    colTiming: "Timing",
    colValOld: "Value (old)",
    colNsOld: "ns (old)",
    colValNew: "Value (new)",
    colNsNew: "ns (new)",
    colValOldAt: (f) => `Value @${f}`,
    colNsOldAt: (f) => `ns @${f}`,
    colValNewAt: (f) => `Value @${f}`,
    colNsNewAt: (f) => `ns @${f}`,
    statusEmpty: "Empty table with standard ZenTimings entries. Enter the frequency and values.",
    statusImportedHtml: (n, f) => `Imported ${n} timings. Frequency from report: ${f} MT/s (editable).`,
    statusImportedCsv: (n) => `Imported ${n} timings from CSV.`,
    statusDone: (n, mode) => `Done. Rows: ${n}. Mode: ${mode}.`,
    modeSafeWord: "safe",
    modeNearestWord: "nearest value",
    statusNearest: (name, target, best, cyc) => `${name}: closest time to ${target} ns is ${best} ns (${cyc} cycles).`,
    statusCsvSaved: "CSV saved.",
    warnLowerFreq: "Target frequency is lower than base — cycle counts were increased, but ns delays may differ.",
    alertBaseFreqFirst: (which) => `Please set the ${which} frequency first.`,
    which_old: "base",
    which_new: "target",
    alertIntError: "Timing (cycles) must be a whole number.",
    alertNsError: "Time must be a number (ns).",
    alertBaseFreqNeeded: "Please set the base frequency.",
    alertNewFreqNeeded: "Please set the target frequency.",
    alertTableEmpty: "Table is empty.",
    errHtmlNoTable: "Memory Timings table not found (id='timingsTable').",
    errHtmlNoFreq: "Could not find the 'Frequency' row.",
    errHtmlRead: "Error reading report: ",
    errCsvEmpty: "File is empty.",
    errCsvCols: "Expected 5 columns (export from this app).",
    errCsvNoTimings: "No timings found.",
    errCsvRead: "Error reading CSV: ",
  },
};

let LANG = (localStorage.getItem('tfc_lang')) || (navigator.language && navigator.language.toLowerCase().startsWith('ru') ? 'ru' : 'en');
function t(key, ...args) {
  const entry = I18N[LANG][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}

function applyStaticI18n() {
  document.documentElement.lang = LANG;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  document.getElementById('langRu').classList.toggle('active', LANG === 'ru');
  document.getElementById('langEn').classList.toggle('active', LANG === 'en');
}

function setLang(lang) {
  LANG = lang;
  localStorage.setItem('tfc_lang', lang);
  applyStaticI18n();
  renderFromState();
}

document.getElementById('langRu').addEventListener('click', () => setLang('ru'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));

const TIMING_NAMES = [
  "RFCsb","CL","RCDWR","RCDRD","RP","RAS","RC","RRDS","RRDL","FAW",
  "WTRS","WTRL","WR","RDRDSCL","WRWRSCL","CWL","RTP","RDWR","WRRD",
  "RDRDSC","RDRDSD","RDRDDD","WRWRSC","WRWRSD","WRWRDD","TRCPAGE","CKE",
  "STAG","STAGsb","MOD","MODPDA","MRD","MRDPDA","RFC","RFC2","REFI",
  "XP","PHYWRD","PHYWRL","PHYRDL","WRPRE","RDPRE","RDPOST","WRPOST","FGR"
];

let timings = {};     // {name: cycles} at the original frequency
let newTimings = {};  // {name: cycles} at the new frequency

const baseFreqInput = document.getElementById('baseFreq');
const newFreqInput = document.getElementById('newFreq');
const tbody = document.getElementById('tbody');
const statusEl = document.getElementById('status');
const warnEl = document.getElementById('warn');

function setStatus(msg) { statusEl.textContent = msg; }
function setWarn(msg) { warnEl.textContent = msg; }

function getBaseFreq() {
  const v = parseFloat(baseFreqInput.value);
  return isNaN(v) ? null : v;
}
function getNewFreq() {
  const v = parseFloat(newFreqInput.value);
  return isNaN(v) ? null : v;
}

function nsFromCycles(cyc, freq) {
  if (cyc === null || cyc === undefined || !freq) return null;
  const clk = freq / 2.0;
  return cyc / clk * 1000.0;
}

function nearestCycleForNs(nsTarget, freq) {
  const clk = freq / 2.0;
  const exact = nsTarget * clk / 1000.0;
  const lower = Math.floor(exact);
  const upper = Math.ceil(exact);
  const candidates = [lower, upper].filter(c => c >= 0);
  if (candidates.length === 0) candidates.push(0);
  let best = candidates[0];
  let bestDiff = Math.abs((best / clk * 1000.0) - nsTarget);
  for (const c of candidates) {
    const diff = Math.abs((c / clk * 1000.0) - nsTarget);
    if (diff < bestDiff) { best = c; bestDiff = diff; }
  }
  return best;
}

function renderEmpty() {
  tbody.innerHTML = '';
  for (const name of TIMING_NAMES) {
    const tr = document.createElement('tr');
    tr.dataset.name = name;
    tr.innerHTML = `
      <td>${name}</td>
      <td class="editable" data-col="val_old"></td>
      <td class="editable" data-col="ns_old"></td>
      <td class="editable" data-col="val_new"></td>
      <td class="editable" data-col="ns_new"></td>
    `;
    tbody.appendChild(tr);
  }
  document.getElementById('hValOld').textContent = t('colValOld');
  document.getElementById('hNsOld').textContent = t('colNsOld');
  document.getElementById('hValNew').textContent = t('colValNew');
  document.getElementById('hNsNew').textContent = t('colNsNew');
}

function renderFromState() {
  const baseFreq = getBaseFreq();
  const newFreq = getNewFreq();
  document.getElementById('hValOld').textContent = baseFreq ? t('colValOldAt', Math.round(baseFreq)) : t('colValOld');
  document.getElementById('hNsOld').textContent = baseFreq ? t('colNsOldAt', Math.round(baseFreq)) : t('colNsOld');
  document.getElementById('hValNew').textContent = newFreq ? t('colValNewAt', Math.round(newFreq)) : t('colValNew');
  document.getElementById('hNsNew').textContent = newFreq ? t('colNsNewAt', Math.round(newFreq)) : t('colNsNew');

  tbody.innerHTML = '';
  for (const name of TIMING_NAMES) {
    const cyc = timings[name];
    const cycNew = newTimings[name];
    const nsOld = (cyc !== undefined) ? nsFromCycles(cyc, baseFreq) : null;
    const nsNew = (cycNew !== undefined) ? nsFromCycles(cycNew, newFreq) : null;

    const tr = document.createElement('tr');
    tr.dataset.name = name;
    tr.innerHTML = `
      <td>${name}</td>
      <td class="editable" data-col="val_old">${cyc !== undefined ? cyc : ''}</td>
      <td class="editable" data-col="ns_old">${nsOld !== null ? nsOld.toFixed(3) : ''}</td>
      <td class="editable" data-col="val_new">${cycNew !== undefined ? cycNew : ''}</td>
      <td class="editable" data-col="ns_new">${nsNew !== null ? nsNew.toFixed(3) : ''}</td>
    `;
    tbody.appendChild(tr);
  }
}

// --- редактирование ячеек ---
tbody.addEventListener('dblclick', (e) => {
  const td = e.target.closest('td.editable');
  if (!td) return;
  const tr = td.closest('tr');
  const name = tr.dataset.name;
  const col = td.dataset.col;
  const currentValue = td.textContent.trim();

  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  td.textContent = '';
  td.appendChild(input);
  input.focus();
  input.select();

  function commit() {
    const raw = input.value.trim().replace(',', '.');
    input.remove();
    if (raw === '') {
      td.textContent = '';
      return;
    }

    if (col === 'val_old' || col === 'val_new') {
      const isOld = col === 'val_old';
      const freq = isOld ? getBaseFreq() : getNewFreq();
      if (!freq) {
        alert(t('alertBaseFreqFirst', t(isOld ? 'which_old' : 'which_new')));
        renderFromState();
        return;
      }
      if (!/^-?\d+$/.test(raw)) {
        alert(t('alertIntError'));
        renderFromState();
        return;
      }
      const cyc = parseInt(raw, 10);
      (isOld ? timings : newTimings)[name] = cyc;
      renderFromState();
      return;
    }

    // ns_old / ns_new
    const isOld = col === 'ns_old';
    const freq = isOld ? getBaseFreq() : getNewFreq();
    if (!freq) {
      alert(t('alertBaseFreqFirst', t(isOld ? 'which_old' : 'which_new')));
      renderFromState();
      return;
    }
    const nsTarget = parseFloat(raw);
    if (isNaN(nsTarget)) {
      alert(t('alertNsError'));
      renderFromState();
      return;
    }
    const bestCyc = nearestCycleForNs(nsTarget, freq);
    (isOld ? timings : newTimings)[name] = bestCyc;
    renderFromState();
    const bestNs = nsFromCycles(bestCyc, freq);
    setStatus(t('statusNearest', name, nsTarget.toFixed(3), bestNs.toFixed(3), bestCyc));
  }

  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { commit(); }
    if (ev.key === 'Escape') { input.remove(); renderFromState(); }
  });
  input.addEventListener('blur', commit);
});

// --- пересчёт ---
document.getElementById('btnCalc').addEventListener('click', () => {
  const baseFreq = getBaseFreq();
  const newFreq = getNewFreq();
  if (!baseFreq) { alert(t('alertBaseFreqNeeded')); return; }
  if (!newFreq) { alert(t('alertNewFreqNeeded')); return; }

  const mode = document.getElementById('modeNearest').checked ? 'nearest' : 'safe';
  const baseClk = baseFreq / 2.0;
  const newClk = newFreq / 2.0;
  newTimings = {};

  for (const name of TIMING_NAMES) {
    const cyc = timings[name];
    if (cyc === undefined) continue;
    const nsOld = cyc / baseClk * 1000.0;
    let cycNew;
    if (cyc === 0) {
      cycNew = 0;
    } else {
      const exact = nsOld * newClk / 1000.0;
      if (mode === 'nearest') {
        const lower = Math.floor(exact), upper = Math.ceil(exact);
        const candidates = [lower, upper].filter(c => c >= 1);
        if (candidates.length === 0) candidates.push(1);
        cycNew = candidates.reduce((best, c) =>
          Math.abs((c / newClk * 1000.0) - nsOld) < Math.abs((best / newClk * 1000.0) - nsOld) ? c : best
        );
      } else if (name === 'REFI') {
        // REFI: больше = лучше -> "не хуже" значит не увеличивать интервал -> вниз
        cycNew = Math.floor(exact);
        if (cycNew < 1) cycNew = 1;
      } else {
        // обычные тайминги: меньше = лучше -> "не хуже" значит не уменьшать задержку -> вверх
        cycNew = Math.ceil(exact);
        if (cycNew < 1) cycNew = 1;
      }
    }
    newTimings[name] = cycNew;
  }

  renderFromState();
  const count = Object.keys(timings).length;
  setStatus(t('statusDone', count, mode === 'nearest' ? t('modeNearestWord') : t('modeSafeWord')));
  setWarn(newFreq < baseFreq ? t('warnLowerFreq') : '');
});

// --- ручной старт ---
document.getElementById('btnManual').addEventListener('click', () => {
  timings = {};
  newTimings = {};
  baseFreqInput.value = '';
  renderEmpty();
  setStatus(t('statusEmpty'));
  setWarn('');
});

// --- импорт HTML-отчёта ---
document.getElementById('fileHtml').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parser = new DOMParser();
      const doc = parser.parseFromString(reader.result, 'text/html');
      const table = doc.getElementById('timingsTable');
      if (!table) throw new Error(t('errHtmlNoTable'));

      const rows = table.querySelectorAll('tr');
      let baseFreq = null;
      const parsed = {};

      rows.forEach((tr, idx) => {
        if (idx === 0) return; // заголовок
        const cells = tr.querySelectorAll('td');
        if (cells.length < 2) return;
        const name = cells[0].textContent.trim();
        const val0 = cells[1].textContent.trim();

        if (name === 'Frequency') {
          const f = parseFloat(val0);
          if (!isNaN(f)) baseFreq = f;
          return;
        }
        if (name === 'Ratio') return;
        if (/^-?\d+$/.test(val0)) {
          parsed[name] = parseInt(val0, 10);
        }
      });

      if (baseFreq === null) throw new Error(t('errHtmlNoFreq'));

      timings = parsed;
      newTimings = {};
      baseFreqInput.value = Math.round(baseFreq);
      renderFromState();
      setStatus(t('statusImportedHtml', Object.keys(parsed).length, Math.round(baseFreq)));
      setWarn('');
    } catch (err) {
      alert(t('errHtmlRead') + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});

// --- импорт своего CSV ---
document.getElementById('fileCsv').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      let text = reader.result;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // BOM
      const lines = text.split(/\r?\n/).filter(l => l.length > 0);
      if (lines.length === 0) throw new Error(t('errCsvEmpty'));

      const header = lines[0].split(';');
      if (header.length < 5) throw new Error(t('errCsvCols'));

      const extractFreq = (col) => {
        const m = col.match(/@(\d+)/);
        return m ? parseFloat(m[1]) : null;
      };
      const baseFreq = extractFreq(header[1]);
      const newFreq = extractFreq(header[3]);

      const parsedOld = {};
      const parsedNew = {};
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(';');
        if (cols.length < 5 || !cols[0]) continue;
        const name = cols[0];
        if (/^-?\d+$/.test(cols[1].trim())) parsedOld[name] = parseInt(cols[1].trim(), 10);
        if (/^-?\d+$/.test(cols[3].trim())) parsedNew[name] = parseInt(cols[3].trim(), 10);
      }

      if (Object.keys(parsedOld).length === 0) throw new Error(t('errCsvNoTimings'));

      timings = parsedOld;
      newTimings = parsedNew;
      baseFreqInput.value = baseFreq ? Math.round(baseFreq) : '';
      if (newFreq) newFreqInput.value = Math.round(newFreq);
      renderFromState();
      setStatus(t('statusImportedCsv', Object.keys(parsedOld).length));
      setWarn('');
    } catch (err) {
      alert(t('errCsvRead') + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});

// --- экспорт CSV ---
document.getElementById('btnExport').addEventListener('click', () => {
  const rows = tbody.querySelectorAll('tr');
  if (rows.length === 0) { alert(t('alertTableEmpty')); return; }

  const baseFreq = getBaseFreq();
  const newFreq = getNewFreq();
  const header = [
    t('colTiming'),
    baseFreq ? t('colValOldAt', Math.round(baseFreq)) : t('colValOld'),
    baseFreq ? t('colNsOldAt', Math.round(baseFreq)) : t('colNsOld'),
    newFreq ? t('colValNewAt', Math.round(newFreq)) : t('colValNew'),
    newFreq ? t('colNsNewAt', Math.round(newFreq)) : t('colNsNew'),
  ];

  const lines = [header.join(';')];
  rows.forEach(tr => {
    const cells = tr.querySelectorAll('td');
    const vals = Array.from(cells).map(td => td.textContent.trim());
    lines.push(vals.join(';'));
  });

  const csvContent = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const bf = baseFreq ? Math.round(baseFreq) : 'old';
  const nf = newFreq ? Math.round(newFreq) : 'new';
  a.href = url;
  a.download = `timings_${bf}_to_${nf}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus(t('statusCsvSaved'));
});

// стартовое состояние
applyStaticI18n();
renderEmpty();
</script>
